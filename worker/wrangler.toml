name = "farvonuy-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Mini App sahifasi. Worker har doim birinchi: "/" va "/tg/…" o'z
# marshrutlarida qoladi, /app esa ASSETS dan index.html ni oladi.
[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = true
# /index.html ni / ga yo'naltirmasin (u yerda bot "ok" javobi)
html_handling = "none"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "farvonuy"
database_id = "f2e2dbdb-7144-41a2-a9df-15ae451acc71"

# Maxfiylar (wrangler secret put): SINX_KALIT, TG_MAXFIY

# Demo rejim (Mini App → Sozlamalar → «Demo rejim»): soxta ma'lumotli
# alohida baza. Yaratish va to'ldirish: bash tools/demo_d1.sh
[[d1_databases]]
binding = "DEMO_DB"
database_name = "farvonuy_demo"
database_id = "bc9a0d3e-108d-438c-a849-32b60c06218f"
